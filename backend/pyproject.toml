[project]
name = "case-study-maker-backend"
version = "0.1.0"
description = "AI proposal automation backend: ingestion, extraction, metadata, search, PPTX generation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "websockets>=12.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "rapidfuzz>=3.6",
    "pillow>=10.2",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Heavy / optional providers. Installed on demand.
embeddings = ["sentence-transformers>=2.6", "torch>=2.2"]
vectorstore = ["chromadb>=0.5"]
llm = ["openai>=1.14", "anthropic>=0.25", "google-generativeai>=0.5"]
ocr = ["pytesseract>=0.3.10"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "reportlab>=4.1",
    "ruff>=0.3",
    "mypy>=1.9",
    "types-Pillow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
